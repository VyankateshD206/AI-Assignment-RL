[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "thermorl"
version = "0.1.0"
description = "Simulation-only, timetable-aware cooling allocation with Q-learning and DQN"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "gymnasium>=1.0,<2", "torch>=2.2", "matplotlib>=3.7"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["thermorl*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools.package-data]
thermorl = ["web/*.html", "web/*.css", "web/*.js", "web/*.svg", "web/*.ttf", "web/*.txt"]
